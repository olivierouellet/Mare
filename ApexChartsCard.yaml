type: custom:apexcharts-card
header:
  title: Today's Tide Levels
  show: true
graph_span: 24h
span:
  start: day
now:
  show: true
  label: Now
yaxis:
  - id: tide
    title:
      text: Water Level (m)
series:
  - entity: sensor.halifax_tides
    name: Tide Level
    type: line
    stroke_width: 2
    color: '#0066cc'
    data_generator: |
      return entity.attributes.tide_data.map((item) => {
        return [new Date(item.time).getTime(), item.value];
      });
apex_config:
  chart:
    height: 400
  xaxis:
    type: datetime
    labels:
      format: HH:mm
  tooltip:
    x:
      format: 'MMM dd, HH:mm'
  stroke:
    curve: smooth